<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semestr ZS 2026/27 — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="shared.css">
    <style>
        .dashboard-navbar { background: #1e293b !important; }
        .hero { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #fff; padding: 3rem 0 2.5rem; margin-bottom: 2rem; }
        .hero h1 { font-size: 2rem; font-weight: 700; }
        .hero p { color: #94a3b8; }
        .subject-card { border-radius: 12px; transition: transform .15s, box-shadow .15s; color: #fff; height: 100%; }
        .subject-card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,0.18); color: #fff; }
        .subject-card .card-icon { font-size: 2.2rem; opacity: .85; }
        .subject-card h5 { font-weight: 700; margin: .5rem 0 .25rem; }
        .subject-card p { font-size: .82rem; opacity: .85; margin: 0; }
        .badge-topic { font-size: .75rem; background: rgba(255,255,255,.2); border-radius: 20px; padding: .2rem .6rem; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: .75rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark fixed-top dashboard-navbar">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="fas fa-graduation-cap me-2"></i>Semestr ZS 2026/27</span>
            <button class="btn btn-link text-white" onclick="document.body.classList.toggle('dark-mode')" title="Přepnout dark mode">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </nav>

    <div class="hero">
        <div class="container">
            <h1><i class="fas fa-book-open me-2"></i>FFÚ · Bankovnictví a kapitálové trhy</h1>
            <p class="mb-0" id="hero-sub"></p>
        </div>
    </div>

    <div class="container pb-5">

        <h2 class="section-title"><i class="fas fa-calendar-alt me-2"></i>Harmonogram</h2>
        <div class="row g-3 mb-4">
            <div class="col-xl-8">
                <div class="topic-section h-100 mb-0">
                    <h4 class="mt-0 mb-3">Týdenní rozvrh <span class="text-muted fw-normal" id="week-label"></span></h4>
                    <div class="timetable" id="timetable"></div>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="topic-section h-100 mb-0">
                    <h4 class="mt-0 mb-3">Termíny</h4>
                    <div id="events"></div>
                </div>
            </div>
        </div>

        <h2 class="section-title"><i class="fas fa-layer-group me-2"></i>Předměty</h2>
        <div class="row g-3" id="course-cards"></div>

        <div class="mt-4">
            <a href="quiz.html" class="text-decoration-none">
                <div class="card subject-card p-3" style="background:linear-gradient(135deg,#0f172a,#1e293b)">
                    <div class="card-icon"><i class="fas fa-question-circle"></i></div>
                    <h5>Procvičování — Quiz</h5>
                    <p>Testové otázky ze všech předmětů · výběr předmětu, tématu a počtu otázek</p>
                    <div class="mt-2"><span class="badge-topic" id="quiz-total"></span></div>
                </div>
            </a>
        </div>
    </div>

    <script src="courses.js"></script>
    <script src="harmonogram.js"></script>
    <script src="quiz-data.js"></script>
    <script>
    (function () {
        const questions = window.QUIZ_DATA || [];
        const credits = COURSES.reduce((sum, c) => sum + c.credits, 0);
        const week = Harmonogram.weekOf(new Date());

        document.getElementById('hero-sub').textContent =
            `${SEMESTER.name} · ${COURSES.length} předmětů · ${credits} kreditů · ${Harmonogram.weekLabel(week)}`;
        document.getElementById('week-label').textContent = `· ${Harmonogram.weekLabel(week)}`;

        Harmonogram.renderTimetable(document.getElementById('timetable'), COURSES);
        Harmonogram.renderEvents(document.getElementById('events'), COURSES);

        document.getElementById('course-cards').innerHTML = COURSES.map((c) => {
            const qCount = questions.filter((q) => q.topic === c.code).length;
            const langBadge = c.lang === 'eng' ? '<span class="badge-topic">EN</span>' : '';
            const optional = c.group === 'V' ? '<span class="badge-topic">volitelný</span>' : '';
            return `<div class="col-md-6 col-xl-4">
                <a href="courses/${c.slug}.html" class="text-decoration-none">
                    <div class="card subject-card p-3" style="background:linear-gradient(135deg, ${c.color}, color-mix(in srgb, ${c.color} 80%, #000))">
                        <div class="card-icon"><i class="fas ${c.icon}"></i></div>
                        <h5>${c.name}</h5>
                        <p>${c.code} · ${c.credits} kr. · ${c.schedule.join(' · ')}</p>
                        <div class="mt-2 d-flex flex-wrap gap-1">
                            <span class="badge-topic">${c.topics.length ? c.topics.length + ' témat' : 'čeká na sylabus'}</span>
                            <span class="badge-topic">${qCount} otázek</span>
                            ${langBadge}${optional}
                        </div>
                    </div>
                </a>
            </div>`;
        }).join('');

        document.getElementById('quiz-total').textContent = `${questions.length} otázek`;
    })();
    </script>
</body>
</html>
