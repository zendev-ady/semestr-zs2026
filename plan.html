<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní plán | ZS 2026/27</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="shared.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
        #plan h1 { color: var(--accent); margin-bottom: 1rem; }
        #plan h2 { color: var(--accent); font-size: 1.3rem; margin-top: 2rem; }
        #plan blockquote { border-left: 4px solid var(--accent); padding: .5rem 1rem; background: rgba(0,0,0,.03); color: #475569; font-size: .9rem; }
        #plan table { font-size: .9rem; }
        #plan code { color: inherit; }
        body.dark-mode #plan blockquote { background: #1e293b; color: #cbd5e1; }
        body.dark-mode #plan table { --bs-table-bg: transparent; --bs-table-color: #e2e8f0; }
    </style>
</head>
<body>
    <script src="courses.js"></script>
    <script src="plans-data.js"></script>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top subject-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" id="back-link" href="index.html"><i class="fas fa-arrow-left me-2"></i>Zpět</a>
            <span class="navbar-text mx-auto"><strong id="nav-title">Studijní plán</strong></span>
            <button class="btn btn-link text-white" onclick="document.body.classList.toggle('dark-mode')" title="Přepnout dark mode">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 1000px">
        <div class="topic-section" id="plan"></div>
    </div>

    <script>
    (function () {
        const code = new URLSearchParams(location.search).get('course');
        const course = code && courseByCode(code);
        const md = code && (window.PLANS || {})[code];
        const el = document.getElementById('plan');

        if (course) {
            document.body.style.setProperty('--accent', course.color);
            document.getElementById('back-link').href = `courses/${course.slug}.html`;
            document.getElementById('nav-title').textContent = `${course.code} · Studijní plán`;
            document.title = `Studijní plán ${course.code} | ZS 2026/27`;
        }
        if (!md) {
            el.innerHTML = `<div class="alert alert-secondary mb-0">Studijní plán${code ? ' pro ' + code : ''} zatím není. Vytvoř <code>podklady/${code || 'KÓD'}/studijni_plan.md</code> a spusť <code>python3 quiz.py export</code>.</div>`;
            return;
        }
        el.innerHTML = marked.parse(md);
        el.querySelectorAll('table').forEach((t) => {
            t.classList.add('table', 'table-bordered', 'summary-table');
            if (t.tHead && !t.tHead.textContent.trim()) t.tHead.remove();   /* tabulka „| | |“ bez záhlaví */
        });
    })();
    </script>
</body>
</html>
